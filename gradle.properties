org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Το KSP προσθέτει ακόμα τα generated sources με το παλιό kotlin.sourceSets DSL,
# το οποίο δεν επιτρέπεται πλέον με το built-in Kotlin του AGP 9.x (google/ksp#2729).
# Αυτή είναι η επίσημη σημαία καταστολής που προτείνει το ίδιο το AGP μέχρι να βγει
# διορθωμένη έκδοση του KSP.
android.disallowKotlinSourceSets=false
